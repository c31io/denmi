<h1 id="几何拓扑">几何拓扑</h1>
<h2 id="定义">定义</h2>
<p>研究流形及其嵌入，聚焦于同胚和微分同胚下保持的拓扑性质。 ## 关键性质
- 低维拓扑 (<span class="math inline">\(n \leq 4\)</span>) -
闭曲面分类：<span class="math inline">\(S^2, T^2, \Sigma_g\)</span> -
纽结在环境同伦下等价 - 3-流形不变量（如基本群） ## 主定理
<strong>闭曲面分类定理。</strong> 任何紧致连通2-流形同胚于环面 <span
class="math inline">\(T^2\)</span> 和射影平面 <span
class="math inline">\(\mathbb{R}P^2\)</span> 的连通和。具体地，<span
class="math inline">\(M \cong \#_g T^2 \#_k \mathbb{R}P^2\)</span>，其中
<span class="math inline">\(g \geq 0\)</span>，<span
class="math inline">\(k \geq 0\)</span>。</p>
